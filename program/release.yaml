  - id: D-07
    decision: "Cut hotfix branch from golden RC"
    due: "as needed"
    R: fw_lead
    A: tpm
    C: [qa_lead]
    I: [oem_lead, csp_lead, sw_lead, hw_lead]
    timezone_note: "Emergency lane: TPM pages leads; decision within 4h regardless of zone"

  - id: D-08
    decision: "Production go / no-go"
    due: "2027-01-15"
    R: tpm
    A: vp_eng
    C: [fw_lead, hw_lead, sw_lead, qa_lead, oem_lead, csp_lead]
    I: [vp_ops]
    timezone_note: "Go/no-go review Thu 17:00 PT / Fri 09:00 Taipei / Fri 06:30 IST; VP Ops co-signs"

  - id: D-09
    decision: "Approve schedule change greater than 1 week"
    due: "as needed"
    R: tpm
    A: vp_eng
    C: [fw_lead, hw_lead, sw_lead, qa_lead, oem_lead, csp_lead]
    I: [vp_ops]
    timezone_note: "Exec review slot; written proposal 48h ahead so Taipei/Hyderabad can comment async"

  - id: D-10
    decision: "Publish post-mortem action items"
    due: "2027-02-12"
    R: tpm
    A: vp_eng
    C: [fw_lead, hw_lead, sw_lead, qa_lead, oem_lead, csp_lead]
