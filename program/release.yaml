# Customer release rings: each ring gates the next.
release_rings:
  - ring: 0
    name: Internal
    scope: "Lab fleets + internal dogfood (~2,000 nodes)"
    entry: ["RC1 smoke pass complete", "24h soak green"]
    exit: ["72h soak green", "No P0 for 7 days"]
  - ring: 1
    name: OEM Qualification
    scope: "Two OEM partners' qual labs"
    entry: ["Gate 4 sign-off", "OEM test plan exchanged"]
    exit: ["OEM qual reports clean", "Written OEM sign-off"]
  - ring: 2
    name: CSP Pilot
    scope: "500-node pilot fleet at CSP partner"
    entry: ["Gate 4 sign-off", "Fleet staged and healthy"]
    exit: ["14-day burn-in green", "Zero P0, telemetry baseline captured"]
  - ring: 3
    name: Production
    scope: "Full fleet rollout per rollout plan"
    entry: ["Gate 5 go decision", "Rollback plan tested"]
    exit: ["Rollout complete", "30-day stability review scheduled"]

# Risk register. probability / impact are 1-5; exposure = P x I.
risks:
  - id: R-01
    title: "PCIe Gen6 link-training regression on retimer path"
    workstream: QA
    probability: 3
    impact: 5
    owner: qa_lead
    status: open
    trigger: ">2% link-down events in 10k-cycle stress run"
    mitigation: "Early stress on DVT boards; retimer FW A/B versions in test matrix; weekly link-margin reviews with HW"
    contingency: "Cap link speed to Gen5 for affected configs; respin schedule +2 weeks"

  - id: R-02
    title: "Retimer part supply delay"
    workstream: HW
    probability: 4
    impact: 4
    owner: hw_lead
    status: open
    trigger: "Supplier misses Oct 30 allocation commit"
    mitigation: "Dual-source qualification in parallel; expedite fees approved; weekly supplier check-ins"
    contingency: "Descope to validated alternate retimer; accept 2-week DVT slip"

  - id: R-03
    title: "Security review backlog delays sign-off"
    workstream: FW
    probability: 3
    impact: 4
    owner: sec_arch
    status: open
    trigger: "Review not started by Nov 16"
    mitigation: "Pre-review engagement in October; phased submission (threat model first, code second)"
    contingency: "Executive escalation to CISO; time-boxed conditional sign-off with follow-ups"

  - id: R-04
    title: "OEM qual slot slip"
    workstream: OEM
    probability: 3
    impact: 4
    owner: oem_lead
    status: open
    trigger: "Slot not confirmed by Oct 30"
    mitigation: "Slots booked early with backup dates; shared test plan reduces on-site time"
    contingency: "Compress pilot by 1 week; run OEM-B qual in parallel with CSP staging"

  - id: R-05
    title: "Thermal corner failure at 40C ambient"
    workstream: HW
    probability: 2
    impact: 5
    owner: hw_lead
    status: open
    trigger: "Any hotspot exceeds spec in DVT thermal runs"
    mitigation: "Early CFD modeling; fan curve v3 validated ahead of DVT; margin added to heatsink spec"
    contingency: "Revised fan curve + targeted airflow shrouds; schedule thermal re-test sprint"

  - id: R-06
    title: "In-band update tooling failure at fleet scale"
    workstream: SW
    probability: 2
    impact: 5
    owner: sw_lead
    status: open
    trigger: "Update failure rate >0.5% on 2k-node dogfood fleet"
    mitigation: "Canary rollout (50 -> 500 -> 2000 nodes); idempotent update design; dry-run mode"
    contingency: "Fall back to out-of-band update path; hotfix tooling in 1-week sprint"

  - id: R-07
    title: "CSP pilot surfaces scale-dependent bug"
    workstream: CSP
    probability: 3
    impact: 3
    owner: csp_lead
    status: open
    trigger: "Crash signature repeats on >5 pilot nodes"
    mitigation: "14-day burn-in with full telemetry; daily pilot health reviews with CSP partner"
    contingency: "Hotfix branch from golden RC; targeted patch release to pilot only"

  - id: R-08
    title: "Holiday coverage gap (Dec 24 - Jan 2)"
    workstream: FW
    probability: 2
    impact: 3
    owner: tpm
    status: open
    trigger: "Coverage roster shows single point of failure in any workstream"
    mitigation: "Coverage roster published Dec 1; on-call pairs across time zones; freeze non-urgent changes"
    contingency: "Contractor backfill for critical roles; defer non-blocking work to January"

# RACI: R = responsible (does the work), A = accountable (final yes/no, exactly one),
# C = consulted (input before decision), I = informed (told after).
# timezone_note states when/where the decision is taken so no region is surprised.
raci:
  - id: D-01
    decision: "Approve code-freeze scope"
    due: "2026-10-23"
    R: fw_lead
    A: tpm
    C: [qa_lead, hw_lead]
    I: [oem_lead, csp_lead]
    timezone_note: "Decided at weekly program review Thu 18:00 PT / Fri 10:00 Taipei / Fri 07:30 IST"

  - id: D-02
    decision: "Accept RC1 into validation"
    due: "2026-11-06"
    R: qa_lead
    A: tpm
    C: [fw_lead]
    I: [sw_lead, oem_lead]
    timezone_note: "Async sign-off in release tracker; 24h window covers all zones"

  - id: D-03
    decision: "Grant security-review exception or deferral"
    due: "2026-12-04"
    R: sec_arch
    A: vp_eng
    C: [fw_lead]
    I: [tpm, qa_lead]
    timezone_note: "Escalation review Tue 09:00 PT / 17:00 Taipei / 22:30 IST (recorded for Hyderabad)"

  - id: D-04
    decision: "Approve thermal spec waiver"
    due: "2026-11-20"
    R: hw_lead
    A: vp_eng
    C: [qa_lead]
    I: [oem_lead, tpm]
    timezone_note: "HW review Wed 17:00 PT / Thu 09:00 Taipei / Thu 06:30 IST"

  - id: D-05
    decision: "Enter OEM qualification (ring 1)"
    due: "2026-12-18"
    R: oem_lead
    A: tpm
    C: [qa_lead]
    I: [csp_lead, sw_lead]
    timezone_note: "Part of Gate 4 sign-off meeting; OEM partners join async via written sign-off"

  - id: D-06
    decision: "Expand CSP pilot fleet"
    due: "2026-12-29"
    R: csp_lead
    A: tpm
    C: [sw_lead]
    I: [fw_lead, qa_lead]
